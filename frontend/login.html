<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Lead Pipeline</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center">

<div x-data="loginApp()" x-cloak class="w-full max-w-sm">
    <div class="bg-gray-900 border border-gray-800 rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Lead Pipeline</h1>
            <p class="text-gray-500 text-sm mt-1">Scraper de Negocios</p>
        </div>
        <form @submit.prevent="login()" class="space-y-4">
            <div>
                <label class="text-xs text-gray-500 mb-1 block">Email</label>
                <input x-model="email" type="email" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
                       placeholder="tu@email.com">
            </div>
            <div>
                <label class="text-xs text-gray-500 mb-1 block">Password</label>
                <input x-model="password" type="password" required
                       class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 transition"
                       placeholder="••••••••">
            </div>
            <div x-show="error" x-text="error" class="text-red-400 text-sm bg-red-900/20 border border-red-800/50 rounded-lg px-4 py-2"></div>
            <button type="submit" :disabled="loading"
                    class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-800 disabled:cursor-not-allowed text-white font-medium py-3 rounded-lg transition flex items-center justify-center gap-2">
                <svg x-show="loading" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span x-text="loading ? 'Ingresando...' : 'Iniciar Sesión'"></span>
            </button>
        </form>
    </div>
</div>

<script>
var SB_URL = 'https://ctwxoqsamykfmmbfrlgb.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN0d3hvcXNhbXlrZm1tYmZybGdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5ODk2MDcsImV4cCI6MjEwMjU2NTYwN30.WvjKlG7y1T69f7TdRXFTSbzajrjzw2wF3BHjHwNNM20';

function loginApp() {
    return {
        email: '',
        password: '',
        loading: false,
        error: '',
        init: function() {
            var t = localStorage.getItem('sb-access-token');
            if (t) window.location.href = '/';
        },
        login: async function() {
            this.loading = true;
            this.error = '';
            try {
                var res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': SB_KEY
                    },
                    body: JSON.stringify({ email: this.email, password: this.password })
                });
                var data = await res.json();
                if (data.error) {
                    this.error = data.error_description || 'Email o contraseña incorrectos';
                    this.loading = false;
                    return;
                }
                localStorage.setItem('sb-access-token', data.access_token);
                localStorage.setItem('sb-refresh-token', data.refresh_token);
                window.location.href = '/';
            } catch (e) {
                this.error = 'Error de conexión';
                this.loading = false;
            }
        }
    }
}
</script>
<script src="/js/alpine.min.js"></script>
</body>
</html>
